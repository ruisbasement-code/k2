<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K2 Climbing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='20' fill='%231d3557'/%3E%3Cpath d='M8 112 L52 40 L64 52 L78 22 L120 112 Z' fill='%236c757d'/%3E%3Cpath d='M78 22 L90 48 L82 44 L74 54 L64 52 Z' fill='%23f1f5f9'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hurt-blur"></div>
<div id="hurt"></div>

<div id="vitals">
  <div id="vital-chips"></div>
  <div class="vital"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.2 1.7-2 3.2-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
    <div id="health" class="bar"><div id="health-fill"></div><div id="health-cap" hidden></div></div></div>
  <div class="vital"><svg viewBox="0 0 24 24"><path d="M13.5 2 4 14h6.5L9 22l11-13h-7z"/></svg>
    <div id="stamina" class="bar"><div id="stamina-fill"></div><div id="stamina-cap"></div></div></div>
  <div class="vital" id="grip-row" hidden><svg viewBox="0 0 24 24"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10h.5V3.5a1.5 1.5 0 0 1 3 0V10h.5V4.5a1.5 1.5 0 0 1 3 0V11h.5V7.5a1.5 1.5 0 0 1 3 0V14c0 4.4-3.1 8-7.5 8S5 19 4.2 16.3L2.6 11a1.4 1.4 0 0 1 2.6-1L7 13z"/></svg>
    <div class="bar"><div id="grip-fill"></div></div></div>
</div>

<div id="day"><span id="day-num">Day 1</span><span id="day-time">05:00</span><span id="day-speed"></span></div>

<div id="held"></div>
<div id="sleep"></div>
<div id="prompt"><div id="alert"></div><div id="actions"></div></div>
<div id="message"></div>
<div id="inventory" hidden></div>
<div id="mini" hidden></div>
<div id="menu" hidden></div>

<div id="death" hidden>
  <div class="card panel">
    <h1>You died</h1>
    <p id="death-cause"></p>
    <p class="act"><kbd>R</kbd> Rescue to <b id="death-camp">Base Camp</b></p>
  </div>
</div>

<div id="collapsed" hidden>
  <div class="card panel">
    <h1>You collapsed</h1>
    <p>Too cold and weak to move. Someone has to find you before the cold does.</p>
    <p id="collapsed-left"></p>
    <p class="act"><kbd>R</kbd> Give up</p>
  </div>
</div>

<div id="loading">Loading K2…</div>
<div id="start">
  <div class="card">
    <h1>K2</h1>
    <p class="sub">8,611 m · Karakoram</p>
    <button id="go">Start</button>
    <p class="hint"><kbd>Esc</kbd> controls</p>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
